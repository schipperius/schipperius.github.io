<!-- Navbar -->
<nav class="border-bottom">
  <div class="container py-3">
    <div class="d-flex align-items-center">

      <!-- Left: Home / Brand -->
      <a href="{{ '/' | relative_url }}"
         class="d-flex align-items-center link-body-emphasis text-decoration-none me-3">
        <span class="fs-4">Home</span>
      </a>

      <!-- Right: Nav links + Theme Dropdown -->
      <div class="d-flex align-items-center ms-auto gap-3">

        <!-- Nav links -->
        <ul class="nav">
          <li class="nav-item">
            <a href="{{ '/' | relative_url }}"
               class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active{% endif %} px-2">
              Home
            </a>
          </li>
          <li class="nav-item">
            <a href="{{ '/about/' | relative_url }}"
               class="nav-link {% if page.url == '/about/' %}active{% endif %} px-2">
              About
            </a>
          </li>
        </ul>

        <!-- Theme dropdown -->
        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false">
            Theme
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" data-bs-theme-value="light">☀ Light</button></li>
            <li><button class="dropdown-item" data-bs-theme-value="dark">🌙 Dark</button></li>
            <li><button class="dropdown-item" data-bs-theme-value="auto">⚙ Auto</button></li>
          </ul>
        </div>

      </div>
    </div>
  </div>
</nav>
<!-- End Navbar -->
